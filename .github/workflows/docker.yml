name: Test & Container bauen

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # wöchentlich: gegen neue EVCC-Versionen testen und Basis-Image auffrischen
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v tests/test_e2e.py

  evcc:
    name: Integration mit neuester EVCC-Version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Neueste EVCC-Version laden
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view -R evcc-io/evcc --json tagName -q .tagName)
          echo "EVCC $TAG"
          gh release download "$TAG" -R evcc-io/evcc -p "evcc_${TAG}_linux-amd64.tar.gz" -O evcc.tgz
          mkdir -p "$RUNNER_TEMP/evcc" && tar xzf evcc.tgz -C "$RUNNER_TEMP/evcc"
          echo "EVCC_BIN=$RUNNER_TEMP/evcc/evcc" >> "$GITHUB_ENV"
          echo "### Getestet mit EVCC $TAG" >> "$GITHUB_STEP_SUMMARY"
      - run: pytest -v -s tests/test_evcc_integration.py

  docker:
    needs: [test, evcc]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Bei GHCR anmelden
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags bestimmen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # amd64 für normale Server/NAS, arm64 für Raspberry Pi 4/5 (64-Bit-OS)
      - name: Bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
