# Portainer: Stacks → Add stack → Web editor → diesen Inhalt einfügen.
# Das Image baut die GitHub-Action und legt es in der GitHub Container Registry ab.
# <GITHUB-NUTZER> durch deinen GitHub-Namen ersetzen (klein geschrieben).
# Lokal selbst bauen statt ziehen: "image:" auskommentieren, "build: ." aktivieren.
services:
  ocpp-bridge:
    image: ghcr.io/<GITHUB-NUTZER>/ocpp-bridge:latest
    # build: .
    container_name: ocpp-bridge
    restart: unless-stopped
    ports:
      - "8887:8887"           # OCPP (Wallbox) + HTTP-API (EVCC) + Statusseite
    volumes:
      - ocpp-bridge-data:/data
    environment:
      TZ: Europe/Berlin
      # --- Ladesteuerung ---
      AUTO_START: "true"        # Plug & Charge: beim Einstecken automatisch RemoteStart
      DISABLE_MODE: "profile"   # Pause per 0 A-Ladeprofil ("stop" = RemoteStop)
      STOP_FALLBACK: "true"     # wenn Ladeprofile abgelehnt werden → RemoteStop
      ID_TAG: "evcc"            # Tag für RemoteStartTransaction
      DEFAULT_CURRENT: "6"
      METER_INTERVAL: "10"      # Sekunden zwischen MeterValues
      # --- Sicherheit (optional) ---
      OCPP_PASSWORD: ""         # OCPP Security Profile 1 (Basic Auth)
      ALLOWED_CHARGERS: ""      # z. B. Seriennummer der Wallbox; leer = alle
      ALLOWED_ID_TAGS: ""       # RFID-Allowlist; leer = jeder Tag
      API_TOKEN: ""             # Bearer-Token für die HTTP-API; leer = offen
      # --- Logging ---
      LOG_LEVEL: "INFO"
      LOG_OCPP: "false"         # true = jede OCPP-Nachricht loggen (Fehlersuche)

volumes:
  ocpp-bridge-data:
